name: pdf-extractext-orchestrator

services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: pdf-extractext-orchestrator:0.1.0
    container_name: pdf-extractext-orchestrator
    restart: unless-stopped
    init: true
    environment:
      # El listener interno es fijo; ORCHESTRATOR_PORT sólo cambia el host.
      PORT: "8080"
      # DNS dentro de la red externa "mired".
      #
      # Extract: el servicio se llama "app" en su docker-compose.yml y escucha en
      # 8080 (PORT=8080). El valor anterior "extract-service:8000" no resolvía en
      # ninguna combinación de red y puerto.
      #
      # AuditLog: container_name "pdf-extractext-auditlog", puerto 8083.
      #
      # Persistence: expone /texts con auth Bearer y escucha en 8000.
      EXTRACT_BASE_URL: ${EXTRACT_BASE_URL:-}
      AUDIT_LOG_BASE_URL: ${AUDIT_LOG_BASE_URL:-}
      PERSISTENCE_BASE_URL: ${PERSISTENCE_BASE_URL:-}
      EXTRACT_HEALTH_URL: ${EXTRACT_HEALTH_URL:-}
      PERSISTENCE_HEALTH_URL: ${PERSISTENCE_HEALTH_URL:-}
      AUDIT_LOG_HEALTH_URL: ${AUDIT_LOG_HEALTH_URL:-}
      HEALTH_CHECK_TIMEOUT: ${HEALTH_CHECK_TIMEOUT:-}
      LOG_MAX_VALUE_LENGTH: ${LOG_MAX_VALUE_LENGTH:-}
      LOG_MAX_STACK_LENGTH: ${LOG_MAX_STACK_LENGTH:-}
      # El token puede venir de Consul KV o del entorno.
      AUDIT_LOG_API_TOKEN: ${AUDIT_LOG_API_TOKEN:?AUDIT_LOG_API_TOKEN is required}
      PERSISTENCE_API_TOKEN: ${PERSISTENCE_API_TOKEN:?PERSISTENCE_API_TOKEN is required}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-}
      MAX_PDF_SIZE_BYTES: ${MAX_PDF_SIZE_BYTES:-}
      MAX_TEXT_BODY_BYTES: ${MAX_TEXT_BODY_BYTES:-}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "${ORCHESTRATOR_PORT:-8080}:8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # La gracia del contenedor debe superar el deadline de apagado configurable.
    # stop_grace_period debe superar SHUTDOWN_TIMEOUT.
    stop_grace_period: ${STOP_GRACE_PERIOD:-45s}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orchestrator.rule=Host(`orchestrator.universidad.localhost`)"
      - "traefik.http.routers.orchestrator.entrypoints=https"
      - "traefik.http.routers.orchestrator.tls=true"
      - "traefik.http.services.orchestrator.loadbalancer.server.port=8080"
      - "traefik.docker.network=mired"
    networks:
      - mired

networks:
  mired:
    external: true
